name: AuraShot Engine

on:
  schedule:
    - cron: '*/5 * * * *'   # Runs every 5 minutes automatically
  workflow_dispatch:          # Also lets you trigger it manually from GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4        # Kill if it hangs (keeps under the 5-min cycle)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Node 20 has built-in fetch — no npm install needed

      - name: Run AuraShot Engine
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: node process.js
